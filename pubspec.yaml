name: developer_cat_dk
description: En Flutter applikation med voice input, data extraction, PDF generation og Supabase integration
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=2.19.0 <3.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  
  # State management
  provider: ^6.0.5
  
  # Voice input
  speech_to_text: ^6.1.1
  
  # Data extraction
  http: ^0.13.5
  
  # PDF generation
  pdf: ^3.10.1
  path_provider: ^2.0.15
  
  # Supabase integration
  supabase_flutter: ^1.10.4
  
  # Secure storage
  flutter_secure_storage: ^8.0.0
  encrypt: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/