name: developer_cat_dk
description: En Flutter applikation med voice input, data extraction, PDF generation og Supabase integration
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ">=2.19.0 <3.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  get_it: ^7.6.0
  
  # State management
  provider: ^6.0.5
  
  # Voice input
  speech_to_text: ^7.3.0
  
  # Data extraction
  http: ^1.5.0
  
  # PDF generation
  pdf: ^3.10.1
  path_provider: ^2.0.15
  
  # Supabase integration
  supabase_flutter: ^2.10.3
  
  # Secure storage
  flutter_secure_storage: ^10.0.0-beta.4
  encrypt: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
