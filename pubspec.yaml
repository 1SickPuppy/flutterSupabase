name: developer_cat_dk
description: En Flutter applikation med voice input, data extraction, PDF generation og Supabase integration
version: 1.0.0+1
publish_to: 'none'

environment:

    sdk: '>=3.0.0 <4.0.0' # Vi sætter den til minimum Dart 3.0



dependencies:

  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  #
  json_annotation: ^4.9.0

  
  # State management
  provider: ^6.0.5
  
  # Voice input
  speech_to_text: ^7.3.0
  
  # Data extraction
  http: ^1.5.0
  google_generative_ai: ^0.4.7
  
  # PDF generation
  pdf: ^3.10.1
  path_provider: ^2.0.15
  universal_html: ^2.2.4
  
  # Supabase integration
  supabase_flutter: ^2.10.3

  # Secure storage
  flutter_secure_storage: ^10.0.0-beta.4
  encrypt: ^5.0.1

  # CSV import & Calendar
  csv: ^6.0.0
  table_calendar: ^3.1.2

  # Quote/Tilbud
  uuid: ^4.0.0

  get_it: any
  intl: any

dev_dependencies:

  build_runner: ^2.4.6

  json_serializable: ^6.7.1

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - developercatfiles/